<app-nav-bar></app-nav-bar>

<main class="min-h-screen bg-white">

  <!-- Loading state -->
  <div *ngIf="!blog" class="flex items-center justify-center min-h-screen">
    <p class="text-gray-400 text-sm tracking-widest uppercase">Loading...</p>
  </div>
  <div *ngIf="blog">
    <div class="relative w-full h-64 sm:h-96 lg:h-130 overflow-hidden bg-gray-100">
      <img [src]="blog.imageUrl" alt="Blog cover image" class="w-full h-full object-cover"/>
      <!-- Dark gradient overlay -->
      <div class="absolute inset-0 bg-linear-to-t from-black/60 via-black/10 to-transparent"></div>
    </div>
    <article class="max-w-6xl mx-auto -mt-16 relative z-10 bg-white rounded-2xl shadow-xl px-8 py-10 sm:px-12 sm:py-12 mb-16">
      <a
        routerLink="/listblog"
        class="inline-flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors mb-6"
        aria-label="Back to blog list"
      >
        <span aria-hidden="true">&larr;</span>
        <span>Back to blog list</span>
      </a>
      <div class="flex items-center gap-3 mb-4">
        <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full capitalize">
          {{ blog.type }}
        </span>
        <span class="text-black text-xs">{{ blog.createdAt }}</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 leading-tight mb-6">{{ blog.title }}</h1>
      <hr class="border-gray-100 mb-6" />
      <p class="text-gray-700 leading-relaxed text-base sm:text-lg">{{ blog.content }}</p>
    </article>
  </div>
</main>

<app-footer></app-footer>
