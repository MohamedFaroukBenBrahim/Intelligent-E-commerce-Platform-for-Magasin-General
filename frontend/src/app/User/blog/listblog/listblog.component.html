<app-nav-bar></app-nav-bar>

<div class="bg-gray-50 relative overflow-x-hidden">
  <div class="relative w-full p-28 overflow-hidden">
    <img [src]="heroBlog?.imageUrl" alt="Hero"class="absolute inset-0 w-full h-full object-cover"/>
    <div class="absolute inset-0 bg-linear-to-b from-black/60 via-black/40 to-black/70"></div>
    <!-- Hero Content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-6">
      <span class="text-blue-300 uppercase tracking-[0.3em] text-sm font-semibold mb-4">{{heroBlog?.type}}</span>
      <h1 class="text-white text-5xl md:text-7xl font-extrabold leading-tight max-w-4xl mb-6">{{heroBlog?.title}}</h1>
      <p class="text-gray-200 text-lg md:text-xl max-w-2xl leading-relaxed mb-10 line-clamp-3">{{heroBlog?.content}}</p>
      <div class="flex gap-4">
        <a [routerLink]="['/blogdetail',heroBlog?.id]" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-8 py-3 rounded-full transition shadow-lg">Read Articles</a>
      </div>
    </div>
    <!-- Scroll indicator -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 animate-bounce">
      <svg class="w-6 h-6 text-white opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </div>

  <!-- ARTICLES SECTION -->
  <section id="articles" class="px-6 lg:px-16 py-24 relative z-10">
    <div class="text-center mb-16">
      <span class="text-blue-500 uppercase tracking-widest text-sm font-semibold">Latest</span>
      <h2 class="text-4xl font-extrabold text-gray-900 mt-2">Recent Articles</h2>
      <div class="flex items-center justify-center gap-4">
        <input [(ngModel)]="searchtext" (ngModelChange)="search()" type="search" class="bg-purple-white shadow rounded border-0 p-3 right-0" placeholder="Search by name...">
        <select [(ngModel)]="selectedType" (change)="search()" class="bg-white border rounded p-2 text-sm">
          <option value="all">All</option>
          <option *ngFor="let t of types" [value]="t">{{t}}</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
    <article *ngFor="let blog of Bloglist.slice(0,-1).reverse()" class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow duration-300">
      <div class="relative">
        <img [src]="blog.imageUrl" class="h-36 w-full aspect-3/2 lg:aspect-3/4 lg:h-128 object-cover shadow-lg">
        <div class="lg:rounded-l-[30px] lg:rounded-t-[30px] bg-white lg:absolute bottom-8 -right-14 lg:w-76 px-8 py-6 lg:h-96 shadow">
          <span class="inline-block text-sm text-gray-500">{{blog.createdAt | date}}</span>
          <h2 class="text-2xl font-bold leading-tight mt-1.5 mb-2.5">{{blog.title}}</h2>
          <span class="inline-block text-blue-400 text-sm capitalize hover:underline">{{blog.type}}</span>
          <p class="text-gray-800 mt-7 mb-7 lg:mb-14 leading-relaxed line-clamp-3">{{blog.content}}</p>
          <a [routerLink]="['/blogdetail',blog.id]" class="flex justify-end items-center uppercase text-blue-800 font-semibold text-sm hover:underline"><span class="mr-4 block w-10 h-0.5 bg-blue-800"></span>read more</a>
        </div>
      </div>
    </article>
    </div>
  </section>
</div>
<app-footer></app-footer>
