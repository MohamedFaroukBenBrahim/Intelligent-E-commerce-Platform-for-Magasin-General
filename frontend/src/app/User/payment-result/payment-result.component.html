 <div class="min-h-screen flex items-center justify-center bg-gray-50">
      <div class="bg-white border border-gray-100 rounded-2xl p-12 text-center max-w-md w-full shadow-sm">

        <!-- Success -->
        <ng-container *ngIf="success">
          <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment successful!</h1>
          <p class="text-gray-500 text-sm mb-8">Your order #{{ orderId }} has been confirmed. Thank you for shopping with MG!</p>
          <button (click)="goHome()"
            class="px-8 py-3 rounded-xl text-white text-sm font-semibold"
            style="background:#D70D0D">
            Back to home
          </button>
        </ng-container>

        <!-- Failure -->
        <ng-container *ngIf="!success">
          <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment failed</h1>
          <p class="text-gray-500 text-sm mb-8">Something went wrong with your payment. Please try again or contact support.</p>
          <button (click)="goCheckout()"
            class="px-8 py-3 rounded-xl text-white text-sm font-semibold"
            style="background:#D70D0D">
            Try again
          </button>
        </ng-container>

      </div>
    </div>
