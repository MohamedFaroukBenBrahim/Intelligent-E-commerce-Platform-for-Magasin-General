<!-- Floating button -->
<button (click)="toggleChat()"
  class="fixed bottom-6 right-6 z-50 w-13 h-13 rounded-full text-white flex items-center justify-center transition-all hover:scale-105 hover:shadow-xl"
  style="background:#18a2cd; width:52px; height:52px; box-shadow:0 4px 14px rgba(24,162,205,0.35);">
  <svg *ngIf="!isOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
  </svg>
  <svg *ngIf="isOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
  <span *ngIf="!isOpen"
    class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2"
    style="background:#ee1d26; border-color:#f0f9fd;">
  </span>
</button>

<!-- Chat window -->
<div *ngIf="isOpen"
  class="fixed bottom-24 right-6 z-50 w-80 md:w-96 bg-white flex flex-col overflow-hidden"
  style="height:480px; border-radius:20px; border:0.5px solid #e5e7eb; box-shadow:0 4px 24px rgba(24,162,205,0.13);">

  <!-- Header -->
  <div class="flex items-center gap-3 px-4 py-3" style="background:#18a2cd;">
    <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
      style="background:rgba(255,255,255,0.15);">
      <svg class="w-4 h-4" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
    </div>
    <div class="flex-1">
      <p class="text-white font-bold text-sm leading-tight">mg Assistant</p>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span class="w-1.5 h-1.5 rounded-full" style="background:#92c744;"></span>
        <span class="text-xs" style="color:rgba(255,255,255,0.75);">Online · Ask me anything</span>
      </div>
    </div>
    <button (click)="toggleChat()"
      class="w-7 h-7 rounded-lg flex items-center justify-center transition hover:bg-white/20"
      style="background:rgba(255,255,255,0.15);">
      <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div id="chat-messages"
    class="flex-1 overflow-y-auto flex flex-col gap-3 p-4"
    style="background:#f8fafc;">

    <div *ngFor="let msg of messages"
      class="flex"
      [ngClass]="msg.role === 'user' ? 'justify-end' : 'justify-start gap-2 items-end'">

      <div *ngIf="msg.role === 'assistant'"
        class="w-7 h-7 rounded-full shrink-0 flex items-center justify-center"
        style="background:#e8f7fc;">
        <svg class="w-3.5 h-3.5" fill="none" stroke="#18a2cd" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
      </div>

      <div class="max-w-[75%] px-3 py-2.5 text-sm leading-relaxed"
        [ngClass]="msg.role === 'user' ? 'text-white' : 'text-gray-700 shadow-sm'"
        [style.whiteSpace]="'pre-wrap'"
        [style.background]="msg.role === 'user' ? '#18a2cd' : '#ffffff'"
        [style.borderRadius]="msg.role === 'user' ? '16px 16px 4px 16px' : '16px 16px 16px 4px'"
        [style.border]="msg.role === 'assistant' ? '0.5px solid #e5e7eb' : 'none'">
        {{ msg.message }}
      </div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isLoading" class="flex items-end gap-2 justify-start">
      <div class="w-7 h-7 rounded-full shrink-0 flex items-center justify-center" style="background:#e8f7fc;">
        <svg class="w-3.5 h-3.5" fill="none" stroke="#18a2cd" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
      </div>
      <div class="bg-white px-3.5 py-3 flex gap-1.5 items-center"
        style="border-radius:16px 16px 16px 4px; border:0.5px solid #e5e7eb;">
        <span class="w-2 h-2 rounded-full animate-bounce" style="background:#18a2cd; animation-delay:0ms;"></span>
        <span class="w-2 h-2 rounded-full animate-bounce" style="background:#18a2cd; animation-delay:150ms;"></span>
        <span class="w-2 h-2 rounded-full animate-bounce" style="background:#18a2cd; animation-delay:300ms;"></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="flex flex-col gap-2 px-3 py-2.5 bg-white" style="border-top:0.5px solid #f0f0f0;">

    <!-- Context selector -->
    <div class="flex gap-1.5">
      <button
        *ngFor="let ctx of contextOptions"
        (click)="selectedContext = ctx.value"
        class="flex-1 text-xs py-1 rounded-lg transition-all font-medium"
        [style.background]="selectedContext === ctx.value ? '#18a2cd' : '#f3f4f6'"
        [style.color]="selectedContext === ctx.value ? 'white' : '#6b7280'"
        [style.border]="selectedContext === ctx.value ? 'none' : '0.5px solid #e5e7eb'">
        {{ ctx.label }}
      </button>
    </div>

    <!-- Input row -->
    <div class="flex items-center gap-2">
      <textarea
        [(ngModel)]="userInput"
        (keydown)="onEnter($event)"
        placeholder="Type your message..."
        rows="1"
        class="flex-1 resize-none text-sm outline-none px-3 py-2 rounded-xl"
        style="background:#f8fafc; border:0.5px solid #e5e7eb; max-height:90px; color:#374151; line-height:1.5;">
      </textarea>
      <button (click)="sendMessage()"
        [disabled]="!userInput.trim() || isLoading"
        class="w-9 h-9 rounded-xl flex items-center justify-center transition shrink-0"
        [style.background]="userInput.trim() && !isLoading ? '#18a2cd' : '#f3f4f6'"
        [style.cursor]="userInput.trim() && !isLoading ? 'pointer' : 'not-allowed'">
        <svg class="w-4 h-4"
          [style.stroke]="userInput.trim() && !isLoading ? 'white' : '#d1d5db'"
          fill="none" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </div>
  </div>

</div>
