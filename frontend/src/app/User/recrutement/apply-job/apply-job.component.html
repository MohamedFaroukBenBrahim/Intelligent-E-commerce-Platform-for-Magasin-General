<app-nav-bar></app-nav-bar>

<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto">

    <a [routerLink]="['/listProducts']"
      class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-red-500 transition-colors mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Jobs
    </a>

    <!-- Loading -->
    <div *ngIf="loading" class="flex justify-center py-20">
      <div class="w-8 h-8 border-4 border-t-transparent rounded-full animate-spin border-red-500"></div>
    </div>

    <div *ngIf="!loading" class="bg-white rounded-3xl shadow-lg overflow-hidden">

      <!-- Top color bar -->
      <div class="flex h-1.5">
        <span class="flex-1 bg-red-500"></span>
        <span class="flex-1 bg-yellow-400"></span>
        <span class="flex-1 bg-green-500"></span>
        <span class="flex-1 bg-sky-400"></span>
      </div>

      <div class="p-8">
        <!-- Job info -->
        <div *ngIf="job" class="mb-8">
          <span class="text-xs font-bold text-sky-500 uppercase tracking-widest">{{ job.contractType }}</span>
          <h2 class="text-2xl font-black text-gray-800 mt-1 mb-1">{{ job.title }}</h2>
          <div class="flex items-center gap-2 text-xs text-gray-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{ job.location }}
          </div>
        </div>

        <!-- No CV warning -->
        <div *ngIf="!hasCv" class="flex items-start gap-4 bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 mb-6">
          <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shrink-0 mt-0.5">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
          <div class="flex-1">
            <p class="text-sm font-bold text-amber-800">CV Required</p>
            <p class="text-xs text-amber-600 mt-1">You need to upload your CV before applying. Go to your profile to upload one.</p>
            <a [routerLink]="['/profile-recrutement']"
              class="inline-flex items-center gap-1.5 mt-3 text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-lg transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              Upload CV Now
            </a>
          </div>
        </div>

        <!-- CV confirmed -->
        <div *ngIf="hasCv" class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-2xl px-5 py-3 mb-6">
          <svg class="w-5 h-5 text-green-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-sm font-semibold text-green-700">Your CV is ready to be submitted</p>
        </div>

        <!-- Success -->
        <div *ngIf="showSuccess" class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm mb-5">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Application submitted successfully! Redirecting...
        </div>

        <!-- Error -->
        <div *ngIf="showError" class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-5">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          {{ errorMsg }}
        </div>

        <!-- Form -->
        <form (ngSubmit)="submit()">
          <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-600 mb-1.5">
              Cover Letter <span class="text-gray-400 font-normal">(optional)</span>
            </label>
            <textarea [(ngModel)]="coverLetter" name="coverLetter" rows="6"
              placeholder="Tell the recruiter why you're the perfect fit for this role..."
              class="block w-full px-4 py-3 text-sm text-gray-700 bg-white border border-gray-200 rounded-xl focus:border-sky-400 focus:outline-none focus:ring-1 focus:ring-sky-100 resize-none">
            </textarea>
          </div>

          <div class="flex justify-end gap-3">
            <button type="button" [routerLink]="['/listProducts']"
              class="px-6 py-2.5 text-sm font-semibold text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
              Cancel
            </button>
            <button type="submit" [disabled]="!hasCv || submitting"
              class="flex items-center gap-2 px-6 py-2.5 text-sm font-black text-white bg-linear-to-r from-red-500 to-orange-400 rounded-xl transition hover:opacity-90 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
              <svg *ngIf="submitting" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
              </svg>
              {{ submitting ? 'Submitting...' : 'Submit Application' }}
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
