<body class="min-h-screen bg-gray-100 flex items-center justify-center p-6 font-nunito">

  <div class="relative w-full max-w-8xl rounded-3xl overflow-hidden shadow-2xl" style="background: #18a2cd;">

    <!-- Decorative blobs -->
    <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full opacity-30" style="background:#fbcb09;"></div>
    <div class="absolute top-6 right-6 w-16 h-16 rounded-full opacity-60" style="background:#fbcb09;"></div>
    <div class="absolute -bottom-12 left-1/3 w-44 h-44 rounded-full opacity-20" style="background:#ee1d26;"></div>
    <div class="absolute bottom-6 left-10 w-10 h-10 rounded-full opacity-40" style="background:#92c744;"></div>

    <div class="relative z-10 flex flex-col md:flex-row gap-10 p-12 md:p-16">

      <!-- Left side -->
      <div class="flex-1 flex flex-col justify-between text-white">
        <div>
          <!-- Accent bar -->
          <div class="flex gap-1.5 mb-5">
            <span class="w-6 h-1.5 rounded-full" style="background:#fbcb09;"></span>
            <span class="w-3 h-1.5 rounded-full" style="background:#ee1d26;"></span>
            <span class="w-2 h-1.5 rounded-full" style="background:#92c744;"></span>
          </div>
          <h1 class="font-sans text-5xl font-black mb-4 tracking-tight leading-tight">
            Contact <span style="color:#fbcb09;">Us</span>
          </h1>
          <p class="text-sm text-white/75 leading-relaxed max-w-xs">
            Have a question or need help? Fill out the form below and our team will get back to you as soon as possible.
          </p>
        </div>

        <!-- Contact info -->
        <div class="mt-10 space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-md" style="background:#ee1d26;">
              <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.47 11.47 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.47 11.47 0 00.57 3.58 1 1 0 01-.25 1.01l-2.2 2.2z"/>
              </svg>
            </div>
            <span class="text-sm font-semibold text-white/90">+(123) 456 7890</span>
          </div>

          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-md" style="background:#92c744;">
              <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <span class="text-sm font-semibold text-white/90">contact&#64;mg.com</span>
          </div>

          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shadow-md" style="background:#ea7d21;">
              <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/>
              </svg>
            </div>
            <span class="text-sm font-semibold text-white/90">11, Street 342, Abcd Fgh</span>
          </div>
        </div>

        <!-- Social icons -->
        <div class="flex gap-3 mt-10">
          <a href="https://www.youtube.com/c/MGTunisia" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-xl flex items-center justify-center transition hover:scale-110" style="background:rgba(255,255,255,0.2);" aria-label="YouTube">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M21.58 7.19a2.9 2.9 0 00-2.04-2.04C17.74 4.67 12 4.67 12 4.67s-5.74 0-7.54.48A2.9 2.9 0 002.42 7.2 30.25 30.25 0 002 12a30.25 30.25 0 00.42 4.81 2.9 2.9 0 002.04 2.04c1.8.48 7.54.48 7.54.48s5.74 0 7.54-.48a2.9 2.9 0 002.04-2.04A30.25 30.25 0 0022 12a30.25 30.25 0 00-.42-4.81zM10 15.5v-7l6 3.5-6 3.5z"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/mg_tunisie/" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-xl flex items-center justify-center transition hover:scale-110" style="background:rgba(255,255,255,0.2);" aria-label="Instagram">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>
            </svg>
          </a>
          <a href="https://www.tiktok.com/@mg_tunisie" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-xl flex items-center justify-center transition hover:scale-110" style="background:rgba(255,255,255,0.2);" aria-label="TikTok">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M14 3v9.14a3.5 3.5 0 11-2-3.14V3h2zm4.5 1.5c.66 1.12 1.78 1.94 3 2.19V9a6.48 6.48 0 01-3-.74V15a6.5 6.5 0 11-6.5-6.5c.17 0 .33.01.5.02v2.02a4.5 4.5 0 104.5 4.5V4.5h1.5z"/>
            </svg>
          </a>
          <a href="https://www.linkedin.com/company/groupe-magasin-g-n-ral/" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-xl flex items-center justify-center transition hover:scale-110" style="background:rgba(255,255,255,0.2);" aria-label="LinkedIn">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M6.94 8.5H3.56V19h3.38V8.5zM5.25 7.12a1.96 1.96 0 110-3.92 1.96 1.96 0 010 3.92zM20.44 13.07V19h-3.36v-5.34c0-1.27-.03-2.91-1.77-2.91-1.77 0-2.04 1.38-2.04 2.82V19H9.91V8.5h3.23v1.43h.05c.45-.85 1.55-1.75 3.2-1.75 3.42 0 4.05 2.25 4.05 5.17z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Right: form card -->
      <div class="w-full md:w-96 bg-white rounded-2xl shadow-xl p-9 flex flex-col gap-6">

        <!-- Card top accent -->
        <div class="flex gap-1 -mt-1 mb-1">
          <span class="flex-1 h-1 rounded-full" style="background:#ee1d26;"></span>
          <span class="flex-1 h-1 rounded-full" style="background:#fbcb09;"></span>
          <span class="flex-1 h-1 rounded-full" style="background:#92c744;"></span>
          <span class="flex-1 h-1 rounded-full" style="background:#18a2cd;"></span>
        </div>
        <form (ngSubmit)="addcontactmessage()" >
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Username</label>
          <input type="text" [(ngModel)]="contactmessage.name" name="name" placeholder="Your name" class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-300 transition">
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Subject</label>
          <input type="text" [(ngModel)]="contactmessage.subject" name="Subject" placeholder="Your Subject" class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-300 transition">
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Email Address</label>
          <input type="email" [(ngModel)]="contactmessage.email" name="email" placeholder="Email Address" class="border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-300 transition">
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Message</label>
          <textarea rows="5" [(ngModel)]="contactmessage.message" name="message" placeholder="Type your message here" class="border border-gray-200 rounded-xl mb-3 px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-300 resize-none transition"></textarea>
        </div>

        <button type="submit" class="cursor-pointer w-full py-3 rounded-xl text-white text-sm font-black tracking-widest uppercase shadow-lg transition hover:opacity-90 hover:shadow-xl" style="background: linear-gradient(135deg, #ee1d26, #ea7d21);">Send Message</button>
      </form>
      </div>
      
    </div>
  </div>

</body>


<app-footer></app-footer>
