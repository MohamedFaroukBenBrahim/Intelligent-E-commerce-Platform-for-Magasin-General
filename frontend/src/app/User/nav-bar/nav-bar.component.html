<nav class="shadow mb-0 bg-white relative z-50">
  <div class="relative flex max-w-7xl flex-col px-4 py-4 md:mx-auto md:flex-row md:items-center">
    <a href="#" class="flex items-center whitespace-nowrap text-2xl font-black">
      <span class="mr-2 text-4xl text-blue-600">
        <img src="assets/mg-logo.jpg" alt="">
      </span>
    </a>
    <input type="checkbox" class="peer hidden" id="navbar-open" />
    <label class="absolute top-5 right-7 cursor-pointer md:hidden" for="navbar-open">
      <span class="sr-only">Toggle Navigation</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16M4 12h16M4 18h16" />
      </svg>
    </label>
    <nav aria-label="Header Navigation" class="peer-checked:mt-8 peer-checked:max-h-80 flex max-h-0 w-full flex-col items-center justify-between self-center overflow-hidden transition-all md:ml-24 md:max-h-full md:flex-row md:items-start">
      <ul class="flex flex-col items-center space-y-2 md:ml-auto md:flex-row md:space-y-0">
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['']">Home</a></li>
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['/listblog']">Blog</a></li>
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['/listProducts']">Products</a></li>
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['/mymg']">MyMG</a></li>
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['/contact']">Contact</a></li>
        <li class="text-gray-600 md:mr-12 hover:text-blue-600"><a [routerLink]="['/recrutement']">Recrutement</a></li>
        <li class="text-gray-600 md:mr-12">
          <a [routerLink]="['/cart']" class="relative inline-flex">
            <img src="/assets/694534.png" class="w-6 h-6" alt="">
            <span *ngIf="cartCount > 0"
              class="absolute -top-2 -right-2 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center leading-none">
              {{ cartCount }}
            </span>
          </a>
        </li>
        <li class="text-gray-600 md:mr-12 ml-auto">
          <button *ngIf="!isLoggedIn()" type="button"
            class="rounded-md ml-2.5 mt-2.5 border-2 border-blue-600 px-6 py-1 font-medium text-blue-600 transition-colors hover:bg-blue-600 hover:text-white cursor-pointer"
            [routerLink]="['/signup']">Sign Up</button>
          <button *ngIf="!isLoggedIn()" type="button"
            class="rounded-md ml-2.5 mt-2.5 border-2 border-blue-600 px-9 py-1 bg-blue-600 font-medium text-white transition-colors hover:bg-white hover:text-blue-600 cursor-pointer"
            [routerLink]="['/login']">Login</button>

          <!-- Avatar trigger only — NO dropdown here -->
          <button *ngIf="isLoggedIn()"
            (click)="toggleDropdown($event)"
            class="flex items-center gap-2 focus:outline-none ml-2.5">
            <div class="w-12 h-12 ml-40 rounded-full overflow-hidden border-2 border-blue-200 hover:border-blue-500 transition-colors">
              <img *ngIf="profilePicture" [src]="profilePicture" class="w-full h-full object-cover">
              <div *ngIf="!profilePicture" class="w-full h-full bg-blue-600 flex items-center justify-center text-white text-sm font-black">
                {{ getInitial() }}
              </div>
            </div>
            <svg class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200"
              [ngClass]="{'rotate-180': showDropdown}"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</nav>

  <!-- Dropdown rendered OUTSIDE nav, fixed to top-right — no overflow issues -->
  <div *ngIf="showDropdown && isLoggedIn()"
    class="fixed top-16 right-4 w-52 bg-white rounded-2xl border border-slate-100 shadow-xl py-2 z-9999">
    <div class="px-4 py-3 border-b border-slate-50">
      <div class="flex items-center gap-3">

        <div class="min-w-0">
          <p class="text-sm font-bold text-slate-800 truncate">{{ username }}</p>
        </div>
      </div>
    </div>

    <div class="py-1">
      <button [routerLink]="['/profile']" (click)="closeDropdown()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        My Profile
      </button>
      <button [routerLink]="['/orderHistory']" (click)="closeDropdown()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        Order History
      </button>
      <button [routerLink]="['/profile-recrutement']" (click)="closeDropdown()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Recruitment
      </button>
    </div>

    <div class="border-t border-slate-50 pt-1">
      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>
    </div>

    <!-- Click outside backdrop -->
    <div class="fixed inset-0 -z-10" (click)="closeDropdown()"></div>
</div>
