<app-nav-bar></app-nav-bar>
<div class="min-h-screen bg-slate-50 font-sans">
  <div class="max-w-7xl mx-auto px-4 py-10 flex flex-col lg:flex-row gap-8">
    <app-profile-sidebar></app-profile-sidebar>
    <main class="flex-1 min-w-0">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">


        <div class="relative px-8 pt-8 pb-6 border-b border-slate-100 overflow-hidden">
          <div class="absolute -top-6 -right-6 w-24 h-24 rounded-full opacity-10 bg-yellow-400"></div>
          <div class="flex gap-1.5 mb-3">
            <span class="w-5 h-1 rounded-full bg-yellow-400"></span>
            <span class="w-3 h-1 rounded-full bg-red-500"></span>
            <span class="w-2 h-1 rounded-full bg-green-400"></span>
          </div>
          <h3 class="text-xl font-black text-slate-800 mb-1">Change Password</h3>
          <p class="text-slate-400 text-sm">Update your account password securely</p>
        </div>

        <div class="p-8">

          <!-- Step 1 -->
          <div *ngIf="step === 1">
            <div class="flex items-center gap-4 bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 mb-6">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background:#e8f7fc;">
                <svg class="w-5 h-5" style="color:#18a2cd;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </div>
              <div>
                <p class="text-sm font-semibold text-slate-800">We'll send a reset code to</p>
                <p class="text-sm font-black" style="color:#18a2cd;">{{ Emailuser }}</p>
              </div>
            </div>
            <button (click)="sendCode()" [disabled]="codeSending"
              class="flex items-center gap-2 px-6 py-2.5 text-white text-sm font-bold rounded-xl shadow-sm transition hover:opacity-90 active:scale-95 disabled:opacity-60"
              style="background: linear-gradient(135deg, #18a2cd, #0f6e8a);">
              <span *ngIf="codeSending" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              {{ codeSending ? 'Sending...' : 'Send Code to Email' }}
            </button>
          </div>

          <!-- Step 2 -->
          <div *ngIf="step === 2" class="space-y-5">
            <div class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm">
              <div class="w-7 h-7 rounded-lg bg-green-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
              Code sent to <span class="font-bold">{{ Emailuser }}</span>. Check your inbox.
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Code from email</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                  </span>
                  <input [(ngModel)]="ResetData.token" type="text" placeholder="Enter your code"
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition"
                    style="--tw-ring-color: #18a2cd;">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">New Password</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                  </span>
                  <input [(ngModel)]="ResetData.newPassword" type="password" placeholder="New password"
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition"
                    style="--tw-ring-color: #18a2cd;">
                </div>
              </div>
            </div>

            <div *ngIf="error" class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm">
              <div class="w-7 h-7 rounded-lg bg-red-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </div>
              {{ error }}
            </div>

            <div *ngIf="showSuccessAlert" class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm">
              <div class="w-7 h-7 rounded-lg bg-green-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
              Password updated successfully!
            </div>

            <div class="flex gap-3 pt-2">
              <button (click)="resetpassword()"
                class="flex items-center gap-2 px-6 py-2.5 text-white text-sm font-bold rounded-xl shadow-sm transition hover:opacity-90 active:scale-95"
                style="background: linear-gradient(135deg, #18a2cd, #0f6e8a);">
                Save New Password
              </button>
              <button (click)="step = 1; error = ''"
                class="px-6 py-2.5 border border-slate-200 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-50 transition">
                Back
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
</div>
<app-footer></app-footer>
