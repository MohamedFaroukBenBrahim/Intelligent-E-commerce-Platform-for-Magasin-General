<aside class="w-full lg:w-72 shrink-0">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

    <!-- Banner -->
    <div class="relative h-28 overflow-hidden" style="background: linear-gradient(135deg, #18a2cd, #0f6e8a);">
      <!-- Decorative blobs -->
      <div class="absolute -top-4 -right-4 w-20 h-20 rounded-full opacity-20 bg-yellow-400"></div>
      <div class="absolute bottom-0 left-1/3 w-16 h-16 rounded-full opacity-10 bg-red-500"></div>
      <div class="absolute top-2 left-4 w-8 h-8 rounded-full opacity-20 bg-green-400"></div>
      <!-- Color bar at bottom of banner -->
      <div class="absolute bottom-0 left-0 right-0 flex h-1">
        <span class="flex-1 bg-red-500"></span>
        <span class="flex-1 bg-yellow-400"></span>
        <span class="flex-1 bg-green-500"></span>
        <span class="flex-1" style="background:#18a2cd;"></span>
      </div>
    </div>

    <!-- Avatar + Info -->
    <div class="relative -mt-12 flex flex-col items-center px-6 pb-5">
      <div class="relative group mb-3">
        <!-- Avatar -->
        <div class="w-24 h-24 rounded-full border-4 border-white shadow-xl overflow-hidden bg-slate-100">
          <img *ngIf="me.profilePictureUrl" [src]="me.profilePictureUrl" [alt]="me.username"
            class="w-full h-full object-cover">
          <div *ngIf="!me.profilePictureUrl"
            class="w-full h-full flex items-center justify-center text-2xl font-black"
            style="background: linear-gradient(135deg, #18a2cd, #0f6e8a); color: white;">
            {{ me.username.charAt(0).toUpperCase() }}
          </div>
        </div>
        <!-- Camera overlay -->
        <label class="absolute inset-0 rounded-full bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <input (change)="updatepicture($event)" type="file" accept="image/*" class="hidden">
        </label>
        <!-- Online dot -->
        <span class="absolute bottom-1 right-1 w-4 h-4 rounded-full border-2 border-white bg-green-400"></span>
      </div>

      <h2 class="text-base font-bold text-slate-800">{{ me.username }}</h2>
      <p class="text-xs text-slate-400 mt-0.5">{{ me.email }}</p>

      <!-- Role badge -->
      <span class="mt-2.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide text-white"
        style="background: linear-gradient(135deg, #18a2cd, #0f6e8a);">
        {{ me.role || 'Member' }}
      </span>
    </div>

    <!-- Divider -->
    <div class="flex h-0.5 mx-4">
      <span class="flex-1 bg-red-400"></span>
      <span class="flex-1 bg-yellow-400"></span>
      <span class="flex-1 bg-green-400"></span>
      <span class="flex-1" style="background:#18a2cd;"></span>
    </div>

    <!-- Nav Links -->
    <nav class="px-3 py-3 space-y-1">

      <button [routerLink]="['/profile']"
        routerLinkActive="text-white shadow-md"
        [routerLinkActiveOptions]="{exact: true}"
        [style.background]="''"
        class="group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-slate-600 hover:bg-slate-50"
        [routerLinkActive]="'active-nav'">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 group-hover:bg-sky-100 transition-colors">
          <svg class="w-4 h-4 text-slate-500 group-hover:text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </span>
        Personal Info
      </button>

      <button [routerLink]="['/orderHistory']"
        routerLinkActive="active-nav"
        class="group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-slate-600 hover:bg-slate-50">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 group-hover:bg-orange-100 transition-colors">
          <svg class="w-4 h-4 text-slate-500 group-hover:text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
        </span>
        Order History
      </button>

      <button [routerLink]="['/myreviews']"
        routerLinkActive="active-nav"
        class="group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-slate-600 hover:bg-slate-50">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 group-hover:bg-yellow-100 transition-colors">
          <svg class="w-4 h-4 text-slate-500 group-hover:text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.448a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118L12 15.347l-3.95 2.878c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L4.065 9.384c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L11.05 2.927z"/>
          </svg>
        </span>
        My Reviews
      </button>

      <button [routerLink]="['/changepassword']"
        routerLinkActive="active-nav"
        class="group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-slate-600 hover:bg-slate-50">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 group-hover:bg-green-100 transition-colors">
          <svg class="w-4 h-4 text-slate-500 group-hover:text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </span>
        Change Password
      </button>

      <button [routerLink]="['/profile-recrutement']"
        routerLinkActive="active-nav"
        class="group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-slate-600 hover:bg-slate-50">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 group-hover:bg-red-100 transition-colors">
          <svg class="w-4 h-4 text-slate-500 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </span>
        Recruitment Profile
      </button>

    </nav>

    <!-- Logout button -->
    <div class="px-3 pb-4">
      <div class="flex h-px bg-slate-100 mb-3 mx-1"></div>
      <button
        (click)="logout()" class="cursor-pointer group w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 text-red-400 hover:bg-red-50 hover:text-red-500">
        <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-red-50 group-hover:bg-red-100 transition-colors">
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </span>
        Logout
      </button>
    </div>

  </div>
</aside>
