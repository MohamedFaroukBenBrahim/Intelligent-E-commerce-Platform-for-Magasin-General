<app-nav-bar></app-nav-bar>
<div class="min-h-screen bg-slate-50 font-sans">
  <div class="max-w-7xl mx-auto px-4 py-10 flex flex-col lg:flex-row gap-8">
    <app-profile-sidebar></app-profile-sidebar>

    <main class="flex-1 min-w-0">
      <form (ngSubmit)="updateprofile()">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <!-- Header -->
          <div class="relative px-8 pt-8 pb-6 border-b border-slate-100 overflow-hidden">
            <div class="absolute -top-6 -right-6 w-24 h-24 rounded-full opacity-10 bg-yellow-400"></div>
            <div class="absolute top-2 right-20 w-10 h-10 rounded-full opacity-10" style="background:#18a2cd;"></div>
            <div class="flex gap-1.5 mb-3">
              <span class="w-5 h-1 rounded-full bg-yellow-400"></span>
              <span class="w-3 h-1 rounded-full bg-red-500"></span>
              <span class="w-2 h-1 rounded-full bg-green-400"></span>
            </div>
            <h3 class="text-xl font-black text-slate-800 mb-1">Personal Information</h3>
            <p class="text-slate-400 text-sm">Update your personal details below</p>
          </div>

          <!-- Form fields -->
          <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Username</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </span>
                  <input [(ngModel)]="me.username" name="username" type="text"
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition"
                    style="--tw-ring-color: #18a2cd;">
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Phone</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                  </span>
                  <input [(ngModel)]="me.phone" name="phone" type="tel" placeholder="+1 234 567 890"
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition"
                    style="--tw-ring-color: #18a2cd;">
                </div>
              </div>

              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Location</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                  </span>
                  <input [(ngModel)]="me.address" name="address" type="text" placeholder="City, Country"
                    class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition"
                    style="--tw-ring-color: #18a2cd;">
                </div>
              </div>

            </div>

            <!-- Alerts -->
            <div *ngIf="showSuccessAlert"
              class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm mt-6">
              <div class="w-7 h-7 rounded-lg bg-green-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
              Profile updated successfully!
            </div>

            <div *ngIf="showErrorAlert"
              class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mt-6">
              <div class="w-7 h-7 rounded-lg bg-red-100 flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </div>
              Failed to update profile. Please try again.
            </div>

            <!-- Actions -->
            <div class="mt-8 flex items-center justify-between pt-6 border-t border-slate-100">
              <p class="text-xs text-slate-400">All fields are optional except username</p>
              <button type="submit"
                class="flex items-center gap-2 px-6 py-2.5 text-white text-sm font-bold rounded-xl shadow-sm transition hover:opacity-90 active:scale-95"
                style="background: linear-gradient(135deg, #18a2cd, #0f6e8a);">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                Save Changes
              </button>
            </div>
          </div>

        </div>
      </form>
    </main>
  </div>
</div>
<app-footer></app-footer>
