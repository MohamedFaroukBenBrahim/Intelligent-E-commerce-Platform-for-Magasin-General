<app-rh-navbar></app-rh-navbar>

<div class="min-h-screen bg-slate-50 p-6">
  <div class="max-w-2xl mx-auto">

    <a [routerLink]="['/RH-jobs']"
      class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-teal-600 transition-colors mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Job Offers
    </a>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8">
      <h2 class="text-xl font-semibold text-slate-800 mb-1">New Job Offer</h2>
      <p class="text-sm text-slate-400 mb-8">Fill in the details to publish a new job offer</p>

      <!-- Success -->
      <div *ngIf="showSuccess" class="flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm mb-6">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        Job offer created successfully! Redirecting...
      </div>

      <!-- Error -->
      <div *ngIf="showError" class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-6">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        {{ errorMsg }}
      </div>

      <form (ngSubmit)="submit()">
        <div class="grid grid-cols-1 gap-5">

          <!-- Title -->
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1.5">
              Job Title <span class="text-red-400">*</span>
            </label>
            <input [(ngModel)]="job.title" name="title" type="text"
              placeholder="e.g. Full Stack Developer"
              class="block w-full px-4 py-2.5 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-100">
          </div>

          <!-- Location + Contract type -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1.5">
                Location <span class="text-red-400">*</span>
              </label>
              <input [(ngModel)]="job.location" name="location" type="text"
                placeholder="e.g. Tunis, Tunisia"
                class="block w-full px-4 py-2.5 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-100">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1.5">
                Contract Type <span class="text-red-400">*</span>
              </label>
                <select [(ngModel)]="job.contractType" name="contractType" class="block w-full px-4 py-2.5 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-100">
                    <option value="">Select...</option>
                    <option value="CDI">Permanent (CDI)</option>
                    <option value="CDD">Fixed-term (CDD)</option>
                    <option value="STAGE">Stage</option>
                    <option value="FREELANCE">Freelance</option>
                    <option value="ALTERNANCE">ALTERNANCE</option> 
                </select>
            </div>
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1.5">
              Description <span class="text-red-400">*</span>
            </label>
            <textarea [(ngModel)]="job.description" name="description" rows="5"
              placeholder="Describe the role, responsibilities, and ideal candidate profile..."
              class="block w-full px-4 py-3 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-100 resize-none">
            </textarea>
          </div>

          <!-- Required skills -->
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1.5">Required Skills</label>
            <input [(ngModel)]="job.requiredSkills" name="requiredSkills" type="text"
              placeholder="e.g. Angular, Java, Spring Boot, SQL..."
              class="block w-full px-4 py-2.5 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-100">
            <p class="text-xs text-slate-400 mt-1.5">Separate skills with commas</p>
          </div>

        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 mt-8">
          <button type="button" [routerLink]="['/RH-jobs']"
            class="px-6 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="loading"
            class="flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 rounded-xl transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
            <svg *ngIf="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
            <svg *ngIf="!loading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Publish Offer
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
