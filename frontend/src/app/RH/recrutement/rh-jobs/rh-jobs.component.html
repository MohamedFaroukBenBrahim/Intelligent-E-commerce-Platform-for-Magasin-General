<app-rh-navbar></app-rh-navbar>
<div class="flex flex-col p-6 min-h-screen bg-slate-50">

  <!-- Search + Add button -->
  <div class="flex items-center gap-3 mb-8">
    <div class="bg-white items-center justify-between flex-1 flex rounded-full shadow-sm border border-slate-200 p-2">
      <input [(ngModel)]="searchtext" class="font-medium rounded-full w-full py-3 pl-4 text-gray-700 bg-transparent leading-tight focus:outline-none text-sm" type="text" placeholder="Search job offers...">
      <div class="bg-teal-600 p-2.5 hover:bg-teal-700 cursor-pointer mx-1 rounded-full transition-colors">
        <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
        </svg>
      </div>
    </div>
    <button [routerLink]="['/RH-addjob']"
      class="flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold px-5 py-3.5 rounded-full shadow-sm transition-colors whitespace-nowrap">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Add Job Offer
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="w-8 h-8 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && listJobOffers.length === 0" class="text-center py-20 text-slate-400">
    <svg class="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <p class="font-medium">No job offers yet</p>
    <p class="text-sm mt-1">Click "Add Job Offer" to create your first one</p>
  </div>

  <!-- Job offer cards -->
  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
    <div *ngFor="let job of listJobOffers"
      class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 hover:shadow-md transition-shadow flex flex-col gap-4">

      <!-- Header -->
      <div class="flex items-start justify-between">
        <div class="w-11 h-11 rounded-xl bg-teal-50 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <span [ngClass]="job.active ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'"
          class="text-xs font-semibold px-3 py-1 rounded-full">
          {{ job.active ? 'Active' : 'Closed' }}
        </span>
      </div>

      <!-- Info -->
      <div>
        <h3 class="text-base font-semibold text-slate-800 mb-1">{{ job.title }}</h3>
        <p class="text-xs text-slate-400 mb-3">{{ job.contractType }}</p>
        <p class="text-sm text-slate-500 leading-relaxed line-clamp-3">{{ job.description }}</p>
      </div>

      <!-- Skills -->
      <div class="flex flex-wrap gap-2">
        <span *ngFor="let skill of getSkills(job.requiredSkills)"
          class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
          {{ skill }}
        </span>
      </div>

      <!-- Footer info -->
      <div class="flex items-center justify-between pt-2 border-t border-slate-50">
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          {{ job.location }}
        </div>
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          {{ getTimeAgo(job.postedAt) }}
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-2">
        <button [routerLink]="['/RH-editjob', job.id]"
          class="flex-1 py-2 text-xs font-semibold text-teal-600 border border-teal-200 rounded-xl hover:bg-teal-50 transition-colors">
          Edit
        </button>
        <button [routerLink]="['/RH-applications', job.id]"  class="flex-1 py-2 text-xs font-semibold text-white bg-teal-600 rounded-xl hover:bg-teal-700 transition-colors">
          Applications ({{ job.applicationCount }})
        </button>
        <button (click)="delete(job.id)" class="cursor-pointer py-2 px-3 text-xs font-semibold text-red-500 border border-red-200 rounded-xl hover:bg-red-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>
