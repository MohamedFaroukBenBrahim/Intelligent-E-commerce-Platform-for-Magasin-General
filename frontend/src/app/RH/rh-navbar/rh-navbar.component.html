<nav class="bg-white/95 backdrop-blur border-b border-slate-200 px-6 h-14 flex items-center justify-between sticky top-0 z-50 shadow-sm">
  <span class="font-display text-teal-700 text-lg">MyRH Portal</span>

  <div class="hidden md:flex items-center gap-6">
    <a [routerLink]="['/RH-home']" class="text-xs font-medium text-slate-500 hover:text-teal-600 transition-colors uppercase tracking-wide">Home</a>
    <a [routerLink]="['/RH-jobs']" class="text-xs font-medium text-slate-500 hover:text-teal-600 transition-colors uppercase tracking-wide">Recruitment</a>
    <a [routerLink]="['/RH-space']" class="text-xs font-medium text-slate-500 hover:text-teal-600 transition-colors uppercase tracking-wide">Space</a>
    <a [routerLink]="['/RH-applications']" class="text-xs font-medium text-slate-500 hover:text-teal-600 transition-colors uppercase tracking-wide">Applications</a>
    <a [routerLink]="['/RH-blog']" class="text-xs font-medium text-slate-500 hover:text-teal-600 transition-colors uppercase tracking-wide">Blogs</a>
  </div>

  <div class="flex items-center gap-3">
    <!-- Avatar with dropdown -->
    <div class="relative avatar-dropdown">
      <button (click)="toggleDropdown()"
        class="w-8 h-8 rounded-full overflow-hidden focus:outline-none hover:ring-2 hover:ring-teal-400 transition-all">

        <!-- Profile picture if exists -->
        <img *ngIf="me.profilePictureUrl" [src]="me.profilePictureUrl"
          class="w-full h-full object-cover" alt="Profile">

        <!-- Initials fallback -->
        <div *ngIf="!me.profilePictureUrl"
          class="w-full h-full bg-teal-600 hover:bg-teal-700 text-white flex items-center justify-center text-xs font-semibold transition-colors">
          {{ getInitials() }}
        </div>
      </button>

      <!-- Dropdown -->
      <div *ngIf="showDropdown"
        class="absolute right-0 mt-2 w-48 bg-white rounded-xl border border-slate-100 shadow-lg py-1 z-50">

        <!-- User info -->
        <div class="px-4 py-3 border-b border-slate-50 flex items-center gap-3">
          <div class="w-8 h-8 rounded-full overflow-hidden shrink-0">
            <img *ngIf="me.profilePictureUrl" [src]="me.profilePictureUrl"
              class="w-full h-full object-cover" alt="Profile">
            <div *ngIf="!me.profilePictureUrl"
              class="w-full h-full bg-teal-600 text-white flex items-center justify-center text-xs font-semibold">
              {{ getInitials() }}
            </div>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-700">{{ me.username }}</p>
            <p class="text-xs text-slate-400">{{ me.role }}</p>
          </div>
        </div>
        <!-- Logout -->
        <button (click)="logout()"
          class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
