<app-admin-sidebar></app-admin-sidebar>

<div class="ml-14 md:ml-64 mt-14 min-h-screen bg-gray-100">
  <div class="w-full container xl:w-11/12 px-4 mx-auto py-8">
    <div class="flex flex-col w-full mb-6 shadow-lg rounded bg-white">

      <header class="rounded-t mb-0 px-4 py-3 border-0">
        <div class="flex flex-wrap justify-between items-center">
          <h1 class="font-semibold text-2xl text-zinc-700 mr-2">Blog</h1>
          <input type="search" [(ngModel)]="searchtext" (ngModelChange)="search()" class="bg-gray-100 shadow rounded border border-gray-200 p-2 text-sm w-140 focus:outline-none focus:ring-2 focus:ring-blue-400"placeholder="Search Blog..."/>
          <select [(ngModel)]="selectedType" (change)="search()" class="ml-2 bg-white border rounded p-2 text-sm">
            <option value="all">All</option>
            <option *ngFor="let t of types" [value]="t">{{t}}</option>
          </select>
          <button [routerLink]="['/admin-addblog']" type="button" class="rounded-md border-2 border-blue-600 px-6 py-1 bg-blue-600 font-medium text-white transition-colors hover:bg-white hover:text-blue-600 cursor-pointer">ADD</button>
        </div>
      </header>

      <!-- Table with horizontal scroll -->
      <div class="px-4 pb-5">
        <table class="w-full text-xs text-left">
          <thead>
            <tr class="border-b border-purple-600 text-slate-600 font-bold">
              <th class="px-1 py-2 text-center">ID</th>
              <th class="px-1 py-2 text-center">Image</th>
              <th class="px-1 py-2 text-center">Title</th>
              <th class="px-1 py-2 text-center">Author</th>
              <th class="px-1 py-2 text-center">Type</th>
              <th class="px-1 py-2 text-center">Published</th>
              <th class="px-1 py-2 text-center">Status</th>
              <th class="px-1 py-2 text-center">Edit</th>
              <th class="px-1 py-2 text-center">Delete</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let blog of Bloglist" class="border-b last:border-0 hover:bg-gray-50 text-xs">
              <!-- ID -->
              <td class="px-1 py-2 text-center text-zinc-500">{{blog.id}}</td>
              <!-- Image -->
              <td class="px-1 py-2 text-center">
                <div class="flex justify-center">
                  <img *ngIf="blog.imageUrl"
                    [src]="blog.imageUrl"
                    alt="Blog image"
                    class="h-10 w-10 object-cover rounded">
                  <span *ngIf="!blog.imageUrl" class="text-zinc-400 text-xs">No image</span>
                </div>
              </td>

              <!-- Title -->
              <td class="px-1 py-2 text-center text-zinc-500 max-w-xs">
                <p class="truncate" title="{{blog.title}}">{{blog.title}}</p>
              </td>

              <!-- Author -->
              <td class="px-1 py-2 text-center text-zinc-500">{{blog.authorUsername}}</td>

              <!-- Type -->
              <td class="px-1 py-2 text-center">
                <span class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-700">
                  {{blog.type}}
                </span>
              </td>
              <!-- Published -->
              <td class="px-1 py-2 text-center">
                <span *ngIf="blog.published" class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Yes</span>
                <span *ngIf="!blog.published" class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs font-medium">No</span>
              </td>
              <!-- Publish/Unpublish Toggle -->
              <td class="px-1 py-2 text-center">
                <button type="button" class="px-2 py-1 text-xs font-medium rounded border"
                  *ngIf="!blog.published"
                  [ngClass]="'bg-yellow-300 border-yellow-400 text-white hover:bg-yellow-400'"
                  (click)="publishe(blog.id)">Publish</button>
                <button type="button" class="px-2 py-1 text-xs font-medium rounded border"
                  *ngIf="blog.published"
                  [ngClass]="'bg-gray-300 border-gray-400 text-white hover:bg-gray-400'"
                  (click)="unpublishe(blog.id)">Unpub</button>
              </td>
              <!-- Edit -->
              <td class="px-1 py-2 text-center">
                <button type="button"
                  class="px-2 py-1 bg-green-400 border border-green-500 text-xs font-medium text-white rounded transition-colors hover:bg-white hover:text-green-400 cursor-pointer"
                  [routerLink]="['/admin-editblog/', blog.id]">Edit</button>
              </td>

              <!-- Delete -->
              <td class="px-2 py-3 text-center">
                <button type="button"
                  class="border-2 border-red-600 px-4 py-1 bg-red-600 text-sm font-medium text-white rounded-md transition-colors hover:bg-white hover:text-red-600 cursor-pointer"
                  (click)="delete(blog.id)">Delete</button>
              </td>

            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
