<app-admin-sidebar></app-admin-sidebar>
<!-- add part -->

<div class="ml-14 md:ml-64 p-6 bg-gray-100 min-h-screen">
    <div class="w-full container xl:w-10/12 mx-auto">
        <div class="max-w-4xl p-6 mx-auto bg-white rounded-md shadow-md">
            <a class="text-blue-600 hover:text-blue-800 font-medium mb-4 inline-block" [routerLink]="['/admin-products']">← Back to Products</a>
            <h2 class="text-lg font-semibold text-gray-700 capitalize">New product</h2>
            <form (ngSubmit)="add()">
                <div class="grid grid-cols-1 gap-6 mt-4 sm:grid-cols-2">
                    <div>
                        <label class="text-gray-700" for="name">Name</label>
                        <input [(ngModel)]="product.name" name="name" id="name" type="text" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                    </div>
                    
                    <div>
                        <label class="text-gray-700" for="Price">Price</label>
                        <input [(ngModel)]="product.price" name="price" id="Price" type="number" step="0.01" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                    </div>
                    
                    <div class="sm:col-span-2">
                        <label class="text-gray-700" for="Description">Description</label>
                        <textarea [(ngModel)]="product.description" name="description" id="Description" rows="3" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring"></textarea>
                    </div>
                    
                    <div>
                        <label class="text-gray-700" for="State">State</label>
                        <select [(ngModel)]="product.state" name="state" id="State" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                            <option value="">Select State</option>
                            <option value="TRENDING">TRENDING</option>
                            <option value="POPULAR">POPULAR</option>
                            <option value="NEW_ARRIVAL">NEW_ARRIVAL</option>
                            <option value="BEST_SELLER">BEST_SELLER</option>
                            <option value="LIMITED">LIMITED</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="text-gray-700" for="Quantity">Quantity</label>
                        <input [(ngModel)]="product.quantity" name="quantity" id="Quantity" type="number" min="0" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                    </div>
                    
                    <div>
                        <label class="text-gray-700" for="discount">Discount (%)</label>
                        <div class="relative mt-2">
                            <input [(ngModel)]="product.discount" name="discount" id="discount" type="number" min="0" max="100" step="1" class="block w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring pr-8">
                            <span class="absolute right-3 top-2 text-gray-500">%</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Enter value between 0-100</p>
                    </div>
                    <div>
                        <label class="text-gray-700" for="Category">Category</label>
                        <select [(ngModel)]="selectedCategoryId" name="category" id="Category" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                            <option [ngValue]="null">Select Category</option>
                            <option *ngFor="let category of categoryList" [ngValue]="category.id">{{category.name}}</option>
                        </select>
                    </div>

                    <div class="sm:col-span-2">
                        <label class="text-gray-700" for="image">Product Image</label>
                        <input (change)="onFileSelected($event)" type="file" name="image" id="image" accept="image/*" class="block w-full px-4 py-2 mt-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:border-blue-500 focus:outline-none focus:ring">
                        <p class="text-xs text-gray-500 mt-1">Upload a product image (optional)</p>
                    </div>

                    <div *ngIf="imagePreview" class="sm:col-span-2">
                        <p class="text-gray-700 text-sm mb-2">Image Preview:</p>
                        <img [src]="imagePreview" alt="Preview" class="max-w-xs h-auto rounded-md border border-gray-300">
                    </div>
                </div>
                
                <div class="flex justify-end mt-6 gap-3">
                    <button type="button" [routerLink]="['/admin-products']" class="px-6 py-2 leading-5 text-gray-700 transition-colors duration-200 transform bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none">Cancel</button>
                    <button type="submit" class="px-6 py-2 leading-5 text-white transition-colors duration-200 transform bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:bg-blue-700">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
