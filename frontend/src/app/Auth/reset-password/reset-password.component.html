<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="relative flex flex-col m-6 space-y-8 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0">
        <div class="flex flex-col justify-center p-8 md:p-14">
            <form (ngSubmit)="resetpassword()" >
                <div class="mb-6">
                    <h1 class="text-4xl font-bold mb-2">Welcome back, Rest your Password Here !</h1>
                </div>
                 <div class="py-4">
                        <span class="mb-2 text-md">Verification Code !</span>
                        <input type="text" class="w-full p-2 border border-gray-300 rounded-md placeholder:font-light placeholder:text-gray-500" [(ngModel)]="ResetData.token" name="verificationCode" placeholder="Enter 6-digit code" maxlength="6" required>
                </div>
                <div class="py-4">
                    <span class="mb-2 text-md">New Password</span>
                    <input type="password" class="w-full p-2 border border-gray-300 rounded-md placeholder:font-light placeholder:text-gray-500" [(ngModel)]="ResetData.newPassword"  name="password" required>
                </div>
                <button type="submit" class="w-full bg-red-700 text-white p-2 rounded-lg mb-6 hover:bg-white hover:text-black hover:border hover:border-gray-300 cursor-pointer">Confirm Password</button>
            </form>
        </div>
        <div class="relative">
            <img src="https://placeholdmon.vercel.app" alt="img" class="w-200 h-full hidden rounded-r-2xl md:block object-cover"/>
            <div class="absolute hidden bottom-10 right-6 p-6 bg-white/30 backdrop-blur-sm rounded drop-shadow-lg md:block">
                <span class="text-white text-xl">We've been using MG to kick"<br />start every new 7oka ton can't <br />imagine living without it."</span>
            </div>
        </div>
    </div>
</div>
