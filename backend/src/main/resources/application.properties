spring.application.name=backend

# Database configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# JWT secret key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# MinIO configuration
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# Spring AI - Groq Configuration
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# Avatar voice chat configuration
avatar.elevenlabs.api-key=${ELEVENLABS_API_KEY}
avatar.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID}
avatar.elevenlabs.model-id=eleven_multilingual_v2
avatar.elevenlabs.output-dir=target/generated-avatar-audio
avatar.ffmpeg.executable=C:/ffmpeg/bin/ffmpeg.exe
avatar.rhubarb.executable=C:/rhubarb/rhubarb.exe
avatar.audio-upload-folder=avatar/audio

# Retry (keep it)
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

# Payment Gateway Configuration - Konnect
konnect.api.url=${KONNECT_API_URL}
konnect.api.key=${KONNECT_API_KEY}
konnect.receiver.wallet.id=${KONNECT_RECEIVER_WALLET_ID}

# Application Callback URL for payment redirects
app.callback.url=${APP_CALLBACK_URL}

# Email from address
spring.mail.from=${SUPPORT_EMAIL}

# Optional env file
spring.config.import=optional:file:.env[.properties]
